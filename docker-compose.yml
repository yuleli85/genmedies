services:
  backend:
    build: ./backend
    container_name: genvoid-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: genvoid-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
